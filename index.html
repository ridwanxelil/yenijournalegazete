<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YENİ JOURNAL</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
  <style>
    /* ── Fotoğraf sarmalayıcı ── */
    .yj-img-wrap {
      width: 100%;
      overflow: hidden;
      background: #ddd;
      /* flex ile büyür — metin az ise fotoğraf daha büyük, metin çok ise küçülür */
      flex: 1;
      min-height: 120px;
    }
    .yj-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .3s ease;
    }
    .card:hover .yj-img-wrap img { transform: scale(1.03); }

    /* Üst spor/magazin: 16:9 sabit oran */
    .yj-top .yj-img-wrap {
      flex: none;
      aspect-ratio: 16/9;
    }

    /* Manşet: serbest, ama minimum yükseklik */
    .yj-manset .yj-img-wrap {
      min-height: 200px;
      max-height: 480px;
    }

    /* Sağ sütun: serbest, minimum yükseklik */
    .yj-side .yj-img-wrap {
      min-height: 100px;
      max-height: 260px;
    }

    /* Izgara kartları (yatay) — sol fotoğraf tam yüksekliği kaplar */
    .yj-grid-img {
      width: 40%;
      flex-shrink: 0;
      overflow: hidden;
      background: #ddd;
      /* kart yüksekliği kadar uzar */
      align-self: stretch;
      min-height: 90px;
    }
    .yj-grid-img img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s; }
    .card:hover .yj-grid-img img { transform: scale(1.04); }

    /* Kart body: flex column — metin alanı sabit, fotoğraf kalanı alır */
    .yj-card-body { display:flex; flex-direction:column; flex-shrink:0; padding:1rem; }
    .yj-card-body .yj-title { flex-shrink:0; }
    .yj-card-body .yj-summary { flex-shrink:0; }

    /* Kart kendisi flex column → img-wrap büyür */
    .yj-manset > a,
    .yj-side > a {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* Tüm kartlar aynı yükseklikte olsun (row stretch) */
    .yj-row-stretch { align-items: stretch; }
    .yj-row-stretch > [class*="col"] { display: flex; flex-direction: column; }
    .yj-row-stretch > [class*="col"] > .card { flex: 1; }

    .card a:hover { opacity: .93; }
    .card { transition: box-shadow .2s; }
    .card:hover { box-shadow: 0 6px 24px rgba(0,0,0,.13) !important; }

    /* Sidebar */
    #sidebar { position:fixed;top:0;right:0;width:380px;height:100%;background:#fff;z-index:2100;
               transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;
               box-shadow:-4px 0 20px rgba(0,0,0,.2); }
    #overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1900; }
    .sb-slot { margin-bottom:12px;padding:10px 12px;background:#f8f9fa;border-radius:8px;border:1px solid #eee; }
    .sb-slot-title { font-weight:700;font-size:.78rem;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px; }
    .sb-url-row { display:flex;gap:5px;margin-bottom:5px; }
    .sb-url-row input { flex:1;padding:4px 8px;border:1px solid #ccc;border-radius:4px;font-size:.78rem;min-width:0; }
    .sb-url-row button { background:#0d6efd;color:#fff;border:none;padding:4px 10px;border-radius:4px;
                         cursor:pointer;font-size:.75rem;white-space:nowrap;flex-shrink:0; }
    .sb-meta-row { display:flex;gap:5px;margin-bottom:5px; }
    .sb-meta-row select, .sb-meta-row input[type=number] { padding:3px 6px;border:1px solid #ccc;border-radius:4px;font-size:.78rem; }
    .sb-preview { font-size:.73rem;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  </style>
</head>

<script>
// ══════════════════════════════════════════════════════════════
//  SABİTLER
// ══════════════════════════════════════════════════════════════
const CATEGORIES = {
  spor:    { label:"SPOR",    feed:"https://www.yenijournal.com/spor/feed" },
  magazin: { label:"MAGAZİN", feed:"https://www.yenijournal.com/magazin/feed" },
  gundem:  { label:"GÜNDEM",  feed:"https://www.yenijournal.com/gundem/feed" },
  siyaset: { label:"SİYASET", feed:"https://www.yenijournal.com/siyaset/feed" },
  ekonomi: { label:"EKONOMİ", feed:"https://www.yenijournal.com/ekonomi/feed" },
  dunya:   { label:"DÜNYA",   feed:"https://www.yenijournal.com/dunya/feed" },
};

const SLOTS_DEFAULT = {
  spor:    { category:"spor",    index:0 },
  magazin: { category:"magazin", index:0 },
  manset:  { category:"gundem",  index:0 },
  grid1:   { category:"gundem",  index:1 },
  grid2:   { category:"ekonomi", index:0 },
  grid3:   { category:"siyaset", index:0 },
  grid4:   { category:"dunya",   index:0 },
  side1:   { category:"gundem",  index:2 },
  side2:   { category:"siyaset", index:1 },
  side3:   { category:"ekonomi", index:1 },
  side4:   { category:"dunya",   index:1 },
};

const SLOT_LABELS = {
  spor:"Üst Sol — Spor", magazin:"Üst Sağ — Magazin",
  manset:"Manşet", grid1:"Izgara 1", grid2:"Izgara 2",
  grid3:"Izgara 3", grid4:"Izgara 4",
  side1:"Sağ 1", side2:"Sağ 2", side3:"Sağ 3", side4:"Sağ 4",
};

const STORE_DATA  = "yj_data_v2";
const STORE_SLOTS = "yj_slots_v2";
const STORE_MANUAL = "yj_manual_v2"; // manuel linkle doldurulmuş slotlar

// ══════════════════════════════════════════════════════════════
//  DEPO
// ══════════════════════════════════════════════════════════════
function loadData()   { try { return JSON.parse(localStorage.getItem(STORE_DATA));  } catch { return null; } }
function loadSlots()  { try { const r=JSON.parse(localStorage.getItem(STORE_SLOTS)); return r?{...SLOTS_DEFAULT,...r}:{...SLOTS_DEFAULT}; } catch { return {...SLOTS_DEFAULT}; } }
function loadManual() { try { return JSON.parse(localStorage.getItem(STORE_MANUAL))||{}; } catch { return {}; } }
function saveData(d)  { localStorage.setItem(STORE_DATA,   JSON.stringify(d)); }
function saveSlots(s) { localStorage.setItem(STORE_SLOTS,  JSON.stringify(s)); }
function saveManual(m){ localStorage.setItem(STORE_MANUAL, JSON.stringify(m)); }

let gData   = loadData();
let gSlots  = loadSlots();
let gManual = loadManual(); // { slotName: { title, url, image, summary } }

function getArticle(slotName) {
  // Manuel link varsa onu kullan
  if (gManual[slotName]) return gManual[slotName];
  const s = gSlots[slotName];
  if (!s || !gData) return null;
  return (gData[s.category]||[])[s.index] || null;
}

// ══════════════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════════════
function fillSlot(name, art) {
  if (!art) return;
  const el = id => document.getElementById(id+"-"+name);
  if (el("title"))   el("title").textContent   = art.title   || "—";
  if (el("summary")) el("summary").textContent = art.summary || "";
  if (el("link"))    el("link").href            = art.url     || "#";
  if (el("date") && art.date) el("date").textContent = art.date;
  if (el("img")) {
    if (art.image) {
      el("img").src = art.image;
      el("img").onerror = function(){ this.style.display="none"; this.closest(".yj-img-wrap,.yj-grid-img").style.display="none"; };
    } else {
      // Fotoğraf yoksa resim alanını gizle
      const wrap = el("img").closest(".yj-img-wrap,.yj-grid-img");
      if (wrap) wrap.style.display = "none";
    }
  }
}

function renderPage() {
  Object.keys(SLOTS_DEFAULT).forEach(n => fillSlot(n, getArticle(n)));
}

document.getElementById("dateText").textContent =
  new Date().toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

if (gData) renderPage();

// ══════════════════════════════════════════════════════════════
//  RSS ÇEKİCİ — proxy zinciri ile
// ══════════════════════════════════════════════════════════════
const PROXIES = [
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
];

async function proxyFetch(url, timeoutMs=10000) {
  let lastErr = "bilinmiyor";
  for (const makeProxy of PROXIES) {
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), timeoutMs);
    try {
      const r = await fetch(makeProxy(url), { signal: ctrl.signal });
      clearTimeout(t);
      if (!r.ok) { lastErr="HTTP "+r.status; continue; }
      const text = await r.text();
      if (text && text.length > 200) return text;
      lastErr = "boş yanıt";
    } catch(e) { clearTimeout(t); lastErr=e.message; }
  }
  throw new Error(lastErr);
}

// RSS feed parse et
async function fetchRSS(key) {
  const feed = CATEGORIES[key].feed;
  const xml = await proxyFetch(feed);
  const doc = new DOMParser().parseFromString(xml, "text/xml");
  const items = [...doc.querySelectorAll("item")].slice(0,12);
  return items.map(item => {
    const title   = item.querySelector("title")?.textContent?.trim() || "";
    const url     = item.querySelector("link")?.textContent?.trim()
                 || item.querySelector("guid")?.textContent?.trim() || "#";
    const summary = (item.querySelector("description")?.textContent||"")
                    .replace(/<[^>]+>/g,"").trim().slice(0,180);
    // RSS enclosure veya media:content ile resim
    let image = item.querySelector("enclosure")?.getAttribute("url")
             || item.querySelector("media\\:content,content")?.getAttribute("url")
             || "";
    // description içinde img src bul
    if (!image) {
      const m = (item.querySelector("description")?.textContent||"").match(/src=["']([^"']+\.(jpg|jpeg|png|webp)[^"']*)/i);
      if (m) image = m[1];
    }
    const pubDate = item.querySelector("pubDate")?.textContent?.trim()||"";
    const date = pubDate ? new Date(pubDate).toLocaleDateString("tr-TR",{day:"numeric",month:"long"}) : "";
    return { title, url, image, summary, date };
  }).filter(a => a.title.length >= 6);
}

// og:meta çek (tek haber URL için)
async function fetchOGMeta(url) {
  const html = await proxyFetch(url, 12000);
  const get = prop => {
    const m = html.match(new RegExp(`<meta[^>]+(?:property|name)=["']${prop}["'][^>]+content=["']([^"'<>]+)["']`,"i"))
           || html.match(new RegExp(`<meta[^>]+content=["']([^"'<>]+)["'][^>]+(?:property|name)=["']${prop}["']`,"i"));
    return m ? m[1].trim() : "";
  };
  const title   = get("og:title")       || get("twitter:title");
  const summary = (get("og:description")|| get("twitter:description")||"").slice(0,180);
  const image   = get("og:image")       || get("twitter:image");
  if (!title) throw new Error("Başlık bulunamadı");
  return { title, summary, image, url };
}

// ══════════════════════════════════════════════════════════════
//  ANA GÜNCELLEME
// ══════════════════════════════════════════════════════════════
async function doFetch() {
  const btn  = document.getElementById("sbFetch");
  const prog = document.getElementById("sbProgress");
  const status = document.getElementById("proxyStatus");
  btn.disabled=true; btn.textContent="Çekiliyor...";
  prog.style.display="block"; status.style.display="none";

  const result={};
  const keys=Object.keys(CATEGORIES);
  let errCount=0;
  for (let i=0;i<keys.length;i++) {
    const k=keys[i];
    document.getElementById("sbBar").style.width=Math.round(((i+.5)/keys.length)*100)+"%";
    document.getElementById("sbText").textContent=CATEGORIES[k].label+" RSS çekiliyor...";
    try {
      result[k] = await fetchRSS(k);
      // RSS'te resim yoksa ilk haberin og:image'ini çek
      for (let j=0;j<Math.min(3,result[k].length);j++) {
        if (!result[k][j].image && result[k][j].url!="#") {
          try {
            const og = await fetchOGMeta(result[k][j].url);
            result[k][j].image = og.image;
            if (!result[k][j].summary) result[k][j].summary = og.summary;
          } catch {}
        }
      }
    } catch(e) { console.warn(k,"RSS hatası:",e.message); result[k]=[]; errCount++; }
    await new Promise(r=>setTimeout(r,200));
  }

  document.getElementById("sbBar").style.width="100%";
  result._fetched = new Date().toISOString();
  saveData(result);
  gData = result;
  prog.style.display="none";
  btn.disabled=false; btn.innerHTML="↻ Haberleri Güncelle";

  status.style.display="block";
  status.innerHTML = errCount===0
    ? `<span style="color:#198754;">✓ Tüm kategoriler güncellendi.</span>`
    : `<span style="color:#dc3545;">⚠ ${errCount} kategori yüklenemedi. (CORS/proxy sorunu)</span>`;

  document.getElementById("sbLastFetch").textContent =
    "Son: "+new Date().toLocaleString("tr-TR");
  renderSbSlots();
  renderPage();
}

// ══════════════════════════════════════════════════════════════
//  MANUEL LINK ÇEKİCİ
// ══════════════════════════════════════════════════════════════
async function fetchFromUrl(slotName) {
  const input = document.getElementById("urlInput-"+slotName);
  const url = (input?.value||"").trim();
  if (!url) { alert("Link girin."); return; }

  const btn  = input.nextElementSibling;
  const prev = document.getElementById("preview-"+slotName);
  btn.disabled=true; btn.textContent="⏳";
  prev.innerHTML="<em style='color:#888;'>Çekiliyor...</em>";

  try {
    const art = await fetchOGMeta(url);
    gManual[slotName] = art;
    saveManual(gManual);
    fillSlot(slotName, art);
    prev.innerHTML=`<a href="${art.url}" target="_blank" style="color:#198754;" title="${art.title}">✓ ${art.title}</a>`;
    input.value="";
  } catch(e) {
    prev.innerHTML=`<span style="color:#dc3545;">✗ ${e.message}</span>`;
  } finally { btn.disabled=false; btn.textContent="↓ Çek"; }
}

function clearManual(slotName) {
  delete gManual[slotName];
  saveManual(gManual);
  fillSlot(slotName, getArticle(slotName));
  renderSbSlots();
}

// ══════════════════════════════════════════════════════════════
//  SİDEBAR
// ══════════════════════════════════════════════════════════════
function openSidebar() {
  document.getElementById("sidebar").style.transform="translateX(0)";
  document.getElementById("overlay").style.display="block";
  renderSbSlots();
  const d=loadData();
  document.getElementById("sbLastFetch").textContent =
    d?._fetched ? "Son: "+new Date(d._fetched).toLocaleString("tr-TR") : "Henüz güncelleme yok.";
}
function closeSidebar() {
  document.getElementById("sidebar").style.transform="translateX(100%)";
  document.getElementById("overlay").style.display="none";
}

function renderSbSlots() {
  const c=document.getElementById("sbSlots");
  c.innerHTML="";
  Object.keys(SLOTS_DEFAULT).forEach(name=>{
    const slot  = gSlots[name];
    const art   = getArticle(name);
    const isManual = !!gManual[name];
    const opts  = Object.entries(CATEGORIES).map(([k,v])=>
      `<option value="${k}" ${k===slot.category?"selected":""}>${v.label}</option>`).join("");

    const div=document.createElement("div");
    div.className="sb-slot";
    div.innerHTML=`
      <div class="sb-slot-title">${SLOT_LABELS[name]}${isManual?` <span style="color:#0d6efd;font-weight:400;">(manuel)</span>`:""}</div>
      <div class="sb-url-row">
        <input type="url" id="urlInput-${name}" placeholder="Link yapıştır → otomatik çeker..."
          onkeydown="if(event.key==='Enter')fetchFromUrl('${name}')">
        <button onclick="fetchFromUrl('${name}')">↓ Çek</button>
        ${isManual?`<button onclick="clearManual('${name}')" style="background:#6c757d;" title="Manüeli sil, RSS'e dön">✕</button>`:""}
      </div>
      <div class="sb-meta-row">
        <select data-slot="${name}" onchange="onSlotChange(this)" style="flex:1;">${opts}</select>
        <input type="number" data-slot="${name}" data-type="idx" onchange="onSlotChange(this)"
          value="${slot.index}" min="0" max="14" style="width:48px;text-align:center;">
      </div>
      <div class="sb-preview" id="preview-${name}">
        ${art?`<a href="${art.url}" target="_blank" style="color:#dc3545;text-decoration:none;">${art.title}</a>`:"<em style='color:#aaa;'>— veri yok —</em>"}
      </div>`;
    c.appendChild(div);
  });
}

function onSlotChange(el) {
  const name  = el.dataset.slot;
  const catEl = document.querySelector(`select[data-slot="${name}"]`);
  const idxEl = document.querySelector(`input[data-type="idx"][data-slot="${name}"]`);
  gSlots[name]={ category:catEl.value, index:parseInt(idxEl?.value)||0 };
  const art=getArticle(name);
  const prev=document.getElementById("preview-"+name);
  if(prev) prev.innerHTML=art
    ?`<a href="${art.url}" target="_blank" style="color:#dc3545;text-decoration:none;">${art.title}</a>`
    :"<em style='color:#aaa;'>— veri yok —</em>";
}

function doSave() {
  saveSlots(gSlots);
  renderPage();
  closeSidebar();
}

// Sayfa açılışında veri yoksa otomatik çek
if (!gData) {
  setTimeout(()=>{
    document.getElementById("proxyStatus").style.display="block";
    document.getElementById("proxyStatus").innerHTML=
      "<em style='color:#888;'>İlk yükleme: haberler otomatik çekiliyor...</em>";
    doFetch();
  }, 500);
}
</script>
