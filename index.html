<script>

// ─── Sabitler ───────────────────────────────────────────────
const CATEGORIES = {
  spor:    { label:"SPOR",    url:"https://www.yenijournal.com/spor/feed" },
  magazin: { label:"MAGAZİN",url:"https://www.yenijournal.com/magazin/feed" },
  gundem:  { label:"GÜNDEM", url:"https://www.yenijournal.com/gundem/feed" },
  siyaset: { label:"SİYASET",url:"https://www.yenijournal.com/siyaset/feed" },
  ekonomi: { label:"EKONOMİ",url:"https://www.yenijournal.com/ekonomi/feed" },
  dunya:   { label:"DÜNYA",  url:"https://www.yenijournal.com/dunya/feed" },
};

const SLOTS_DEFAULT = {
  spor:    { category:"spor",    index:0 },
  magazin: { category:"magazin", index:0 },
  manset:  { category:"gundem",  index:0 },
  grid1:   { category:"gundem",  index:1 },
  grid2:   { category:"ekonomi", index:0 },
  grid3:   { category:"siyaset", index:0 },
  grid4:   { category:"dunya",   index:0 },
  side1:   { category:"gundem",  index:2 },
  side2:   { category:"siyaset", index:1 },
  side3:   { category:"ekonomi", index:1 },
  side4:   { category:"dunya",   index:1 },
};

const SLOT_LABELS = {
  spor:"Üst Sol — Spor", magazin:"Üst Sağ — Magazin",
  manset:"Manşet", grid1:"Izgara 1", grid2:"Izgara 2",
  grid3:"Izgara 3", grid4:"Izgara 4",
  side1:"Sağ Kart 1", side2:"Sağ Kart 2", side3:"Sağ Kart 3", side4:"Sağ Kart 4"
};

const STORE_DATA  = "yj_data";
const STORE_SLOTS = "yj_slots";

// ─── Yardımcılar ─────────────────────────────────────────────
function loadData()  { try { return JSON.parse(localStorage.getItem(STORE_DATA));  } catch { return null; } }
function loadSlots() { try { const r = JSON.parse(localStorage.getItem(STORE_SLOTS)); return r ? {...SLOTS_DEFAULT,...r} : {...SLOTS_DEFAULT}; } catch { return {...SLOTS_DEFAULT}; } }
function saveData(d) { localStorage.setItem(STORE_DATA,  JSON.stringify(d)); }
function saveSlots(s){ localStorage.setItem(STORE_SLOTS, JSON.stringify(s)); }

function getArticle(data, slots, slot) {
  const s = slots[slot]; if (!s || !data) return null;
  return (data[s.category] || [])[s.index] || null;
}

// ─── CORS Proxy ile doğrudan HTML çekme ──────────────────────
const PROXY  = u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`;
const PROXY2 = u => `https://corsproxy.io/?${encodeURIComponent(u)}`;

async function fetchPage(url) {
  for (const fn of [PROXY, PROXY2]) {
    try {
      const res = await fetch(fn(url), { signal: AbortSignal.timeout(12000) });
      if (!res.ok) continue;
      const data = await res.json();
      return data.contents || data;
    } catch(e) { continue; }
  }
  return null; // proxy başarısız → null döner, Claude API'ye fallback
}

function extractNewsFromHtml(html, catKey) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const items = [];
  const seen = new Set();

  doc.querySelectorAll('a').forEach(a => {
    const href = a.href || '';
    if (!href.includes('yenijournal.com')) return;
    if (/\/(kategori|etiket|yazar|tag|category|author|page|rss|hava|namaz|nobetci|trafik|futbol)\//i.test(href)) return;
    if (seen.has(href)) return;
    const title = (a.getAttribute('title') || a.textContent || '').trim().replace(/\s+/g, ' ');
    if (title.length < 15) return;
    seen.add(href);

    // Yakın img ara
    let image = '';
    const imgEl = a.querySelector('img') || a.closest('article,div,li')?.querySelector('img');
    if (imgEl) {
      image = imgEl.getAttribute('data-src') || imgEl.getAttribute('src') || '';
      if (image && !image.startsWith('http')) image = '';
      if (image && (image.includes('no_headline') || image.includes('logo'))) image = '';
    }
    items.push({ title, url: href, image, summary: '' });
  });
  return items;
}

// ─── Claude API fallback (web_search ile) ────────────────────
async function fetchCatViaAPI(key) {
  const cat = CATEGORIES[key];
  const prompt = `site:yenijournal.com/${key} haber başlıkları

Yenijournal.com sitesinin "${cat.label}" kategorisindeki en güncel haberlerden 10 tanesini listele.
Her haber için şu JSON formatını kullan. Sadece JSON array döndür, başka hiçbir şey yazma:
[
  {
    "title": "Haber başlığı",
    "url": "https://www.yenijournal.com/tam-haber-url",
    "summary": "Haberin kısa özeti (1-2 cümle)",
    "image": ""
  }
]
Sadece gerçek, yenijournal.com'a ait URL'leri kullan. Uydurma.`;

  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      tools: [{ type: "web_search_20250305", name: "web_search" }],
      messages: [{ role: "user", content: prompt }]
    })
  });

  if (!res.ok) throw new Error("API HTTP " + res.status);
  const data = await res.json();

  const text = (data.content || [])
    .filter(b => b.type === "text")
    .map(b => b.text)
    .join("");

  const match = text.match(/\[\s*\{[\s\S]*?\}\s*\]/);
  if (!match) { console.warn(key, "API JSON bulunamadı:", text.slice(0, 200)); return []; }

  const items = JSON.parse(match[0]);
  return items
    .filter(a => a.title && a.title.length >= 8)
    .map(a => ({
      title:   a.title.trim(),
      url:     a.url || "#",
      image:   a.image || "",
      summary: (a.summary || "").trim().slice(0, 180),
    }));
}

// ─── Ana çekme fonksiyonu: Proxy → API fallback ───────────────
async function fetchCat(key) {
  const cat = CATEGORIES[key];
  // 1. Önce doğrudan HTML çekmeyi dene
  try {
    const html = await fetchPage(cat.url.replace('/feed', ''));
    if (html) {
      const items = extractNewsFromHtml(html, key);
      if (items.length >= 3) {
        console.log(key, "proxy ile çekildi:", items.length, "haber");
        return items.slice(0, 15);
      }
    }
  } catch(e) {
    console.warn(key, "proxy hatası:", e.message);
  }
  // 2. Proxy başarısız → Claude API
  console.log(key, "API fallback'e geçiliyor...");
  return await fetchCatViaAPI(key);
}

// ─── Render sayfası ──────────────────────────────────────────
let gData  = loadData();
let gSlots = loadSlots();

function fillSlot(name, art) {
  if (!art) return;
  const q = id => document.getElementById(id+"-"+name);
  if (q("title"))   q("title").textContent   = art.title   || "—";
  if (q("summary")) q("summary").textContent = art.summary || "";
  if (q("link"))    q("link").href           = art.url     || "#";
  if (q("img") && art.image) {
    q("img").src = art.image;
    q("img").onerror = function(){ this.src = "https://picsum.photos/seed/"+name+"/800/400"; };
  }
}

function renderPage() {
  Object.keys(SLOTS_DEFAULT).forEach(n => fillSlot(n, getArticle(gData, gSlots, n)));
}

// Tarih
document.getElementById("dateText").textContent =
  new Date().toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

if (gData) renderPage();

// ─── Sidebar ─────────────────────────────────────────────────
function openSidebar() {
  document.getElementById("sidebar").style.transform = "translateX(0)";
  document.getElementById("overlay").style.display = "block";
  renderSbSlots();
  updateSbDate();
}
function closeSidebar() {
  document.getElementById("sidebar").style.transform = "translateX(100%)";
  document.getElementById("overlay").style.display = "none";
}

function updateSbDate() {
  const d = loadData();
  document.getElementById("sbLastFetch").textContent =
    d?._fetched ? "Son: " + new Date(d._fetched).toLocaleString("tr-TR") : "Henüz güncelleme yok.";
}

function renderSbSlots() {
  const c = document.getElementById("sbSlots");
  c.innerHTML = "";
  Object.keys(SLOTS_DEFAULT).forEach(name => {
    const slot = gSlots[name];
    const art  = getArticle(gData, gSlots, name);
    const opts = Object.entries(CATEGORIES).map(([k,v]) =>
      `<option value="${k}" ${k===slot.category?"selected":""}>${v.label}</option>`).join("");

    const div = document.createElement("div");
    div.style.cssText = "margin-bottom:14px;padding:10px;background:#f8f9fa;border-radius:8px;";
    div.innerHTML = `
      <div style="font-weight:700;font-size:.8rem;margin-bottom:6px;color:#333;">${SLOT_LABELS[name]}</div>
      <div style="display:flex;gap:6px;margin-bottom:6px;">
        <select data-slot="${name}" data-type="cat" onchange="onSlotChange(this)"
          style="flex:1;padding:4px 6px;border:1px solid #ccc;border-radius:4px;font-size:.82rem;">
          ${opts}
        </select>
        <input type="number" data-slot="${name}" data-type="idx" onchange="onSlotChange(this)"
          value="${slot.index}" min="0" max="14"
          style="width:52px;padding:4px 6px;border:1px solid #ccc;border-radius:4px;font-size:.82rem;text-align:center;">
      </div>
      <div style="font-size:.75rem;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="preview-${name}">
        ${art ? `<a href="${art.url}" target="_blank" style="color:#dc3545;text-decoration:none;" title="${art.title}">${art.title}</a>` : "<em style='color:#aaa;'>— veri yok —</em>"}
      </div>`;
    c.appendChild(div);
  });
}

function onSlotChange(el) {
  const name = el.dataset.slot;
  const catEl = document.querySelector(`select[data-slot="${name}"]`);
  const idxEl = document.querySelector(`input[data-slot="${name}"]`);
  gSlots[name] = { category: catEl.value, index: parseInt(idxEl.value)||0 };
  const art = getArticle(gData, gSlots, name);
  const prev = document.getElementById("preview-"+name);
  if (prev) prev.innerHTML = art
    ? `<a href="${art.url}" target="_blank" style="color:#dc3545;text-decoration:none;" title="${art.title}">${art.title}</a>`
    : "<em style='color:#aaa;'>— veri yok —</em>";
}

async function doProxyTest() {
  const panel = document.getElementById("proxyStatus");
  panel.style.display = "block";
  panel.innerHTML = "<em style='color:#888;'>Bağlantılar test ediliyor...</em>";

  // 1. Proxy testi
  let proxyOk = false;
  try {
    const t0 = Date.now();
    const res = await fetch(PROXY("https://www.yenijournal.com/"), { signal: AbortSignal.timeout(8000) });
    const ms = Date.now() - t0;
    if (res.ok) {
      proxyOk = true;
      panel.innerHTML = `<span style="color:#198754;font-weight:700;">✓ CORS Proxy bağlantısı başarılı (${ms}ms)</span><br>`;
    }
  } catch(e) {
    panel.innerHTML = `<span style="color:#e67e00;">⚠ CORS Proxy başarısız (${e.message.slice(0,40)})</span><br>`;
  }

  // 2. Claude API testi
  try {
    const t0 = Date.now();
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 50,
        messages: [{ role: "user", content: "Sadece 'OK' yaz." }]
      })
    });
    const data = await res.json();
    const ms = Date.now() - t0;
    if (res.ok && data.content) {
      panel.innerHTML += `<span style="color:#198754;font-weight:700;">✓ Claude API bağlantısı başarılı (${ms}ms)</span><br>`;
      panel.innerHTML += `<small style="color:#555;">${proxyOk ? "Proxy önce denenecek, sonra API." : "Proxy yok — sadece Claude API kullanılacak."}</small>`;
    } else {
      panel.innerHTML += `<span style="color:#dc3545;">✗ API hatası: ${data.error?.message || res.status}</span>`;
    }
  } catch(e) {
    panel.innerHTML += `<span style="color:#dc3545;">✗ Claude API bağlantı hatası: ${e.message}</span>`;
  }
}

async function doFetch() {
  const btn = document.getElementById("sbFetch");
  const prog = document.getElementById("sbProgress");
  const panel = document.getElementById("proxyStatus");
  btn.disabled = true; btn.textContent = "Çekiliyor...";
  prog.style.display = "block";
  panel.style.display = "none";
  const result = {};
  const keys = Object.keys(CATEGORIES);
  let errorCount = 0;
  for (let i=0; i<keys.length; i++) {
    const k = keys[i];
    document.getElementById("sbBar").style.width = Math.round((i/keys.length)*100)+"%";
    document.getElementById("sbText").textContent = CATEGORIES[k].label + " haberleri aranıyor...";
    result[k] = await fetchCat(k);
    if (result[k].length === 0) errorCount++;
    await new Promise(r=>setTimeout(r,300));
  }
  document.getElementById("sbBar").style.width = "100%";
  result._fetched = new Date().toISOString();
  saveData(result);
  gData = result;
  prog.style.display = "none";
  btn.disabled = false; btn.innerHTML = "↻ Haberleri Güncelle";
  if (errorCount > 0) {
    panel.style.display = "block";
    panel.innerHTML = `<span style="color:#dc3545;">⚠ ${errorCount} kategori yüklenemedi. "API Testi" butonuna basın.</span>`;
  } else {
    panel.style.display = "block";
    panel.innerHTML = `<span style="color:#198754;">✓ Tüm kategoriler başarıyla güncellendi.</span>`;
  }
  updateSbDate();
  renderSbSlots();
  renderPage();
}

function doSave() {
  saveSlots(gSlots);
  renderPage();
  closeSidebar();
}
</script>
